<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Ruyalab Mascot — Grow</title><desc id="desc">Editable vector mascot inspired by Ruyalab's living vision symbol, in white, electric blue and purple.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071020"/><stop offset=".58" stop-color="#101d4b"/><stop offset="1" stop-color="#180d3e"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#e9f1ff"/><stop offset=".76" stop-color="#b8c8f4"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
 <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ff6ff"/><stop offset=".42" stop-color="#168aff"/><stop offset=".75" stop-color="#3438ef"/><stop offset="1" stop-color="#a34dff"/></linearGradient>
 <linearGradient id="purpleBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43eaff"/><stop offset=".55" stop-color="#387bff"/><stop offset="1" stop-color="#a64dff"/></linearGradient>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5af4ff"/><stop offset=".5" stop-color="#4e78ff"/><stop offset="1" stop-color="#bd64ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#267dff" stop-opacity=".6"/><stop offset="1" stop-color="#267dff" stop-opacity="0"/></radialGradient>
 <radialGradient id="floorGlow"><stop stop-color="#4deaff" stop-opacity=".8"/><stop offset="1" stop-color="#684bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="blueOrb"><stop stop-color="#e7ffff"/><stop offset=".35" stop-color="#42ddff"/><stop offset="1" stop-color="#2764ff"/></radialGradient>
 <radialGradient id="purpleOrb"><stop stop-color="#fff"/><stop offset=".4" stop-color="#b56bff"/><stop offset="1" stop-color="#5b37ee"/></radialGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<ellipse cx="500" cy="315" rx="350" ry="260" fill="url(#glow)" filter="url(#softGlow)"/>

